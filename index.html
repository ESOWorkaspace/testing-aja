<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    main { text-align: center; padding: 16px; }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    #output { margin-top: 16px; font-size: 1.25rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World! 👋</h1>
    <input id="name" placeholder="Nama kamu" style="padding:10px;font-size:1rem;border-radius:8px;border:1px solid #ccc">
    <button id="sayHello">Say Hello</button>
    <p id="output"></p>
  </main>

  <script>
    document.getElementById('sayHello').addEventListener('click', () => {
      const name = document.getElementById('name').value.trim() || 'World';
      document.getElementById('output').textContent = `Hello, ${name}!`;
      console.log(`Hello, ${name}!`);
    });
  </script>
</body>
</html>
